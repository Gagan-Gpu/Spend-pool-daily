
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222a3b">
<title>Spend Pool</title>
<style>
@font-face{font-family:Manrope;src:local("Manrope")}
@font-face{font-family:Bricolage Grotesque;src:local("Bricolage Grotesque")}
:root{color-scheme:dark;--bg:#222a3b;--fg:#f3f3ed;--card:#2e3749;--muted:#414b5f;--mutedfg:#b3b7be;--primary:#c9f04a;--line:#ffffff15;--danger:#ff7d7d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0}
main{max-width:448px;min-height:100dvh;margin:auto;padding:16px 16px 110px}
.space{display:flex;flex-direction:column;gap:20px}
.date{font-size:14px;color:var(--mutedfg);padding-top:8px}
.pool{border-radius:32px;padding:24px;background:radial-gradient(120% 140% at 100% 0%,#c9f04a22,transparent 55%),var(--card);border:1px solid #c9f04a40}
.upper{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mutedfg)}
.total{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:48px;letter-spacing:-.055em;margin:4px 0 0;color:var(--primary);font-weight:700;font-variant-numeric:tabular-nums}
.muted{font-size:13px;color:var(--mutedfg)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quick button{display:flex;min-height:112px;flex-direction:column;justify-content:space-between;text-align:left;padding:16px;border-radius:24px;border:1px solid var(--line);transition:transform .12s}
.quick button:active{transform:scale(.96)}
.em{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;font-size:24px}
.catname{display:block;font-weight:700}
.catamt{display:block;font-size:14px;color:var(--mutedfg);margin-top:2px}
.card{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:20px}
.h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:18px;font-weight:700;margin:0 0 12px}
.hint{background:var(--muted);border-radius:16px;padding:12px;font-size:14px;line-height:1.5;margin-bottom:16px}
.empty{text-align:center;padding:32px 8px}
.empty .big{font-size:36px}
.empty strong{display:block;margin:8px 0 4px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.grow{flex:1;min-width:0}
.txnote{font-weight:600;overflow-wrap:anywhere}
.txmeta{font-size:12px;color:var(--mutedfg)}
.txmoney{font-weight:700;font-variant-numeric:tabular-nums}
.txactions{display:flex;gap:5px;margin-top:6px;justify-content:flex-end}
.tiny{font-size:11px;padding:5px 8px;border-radius:9px;background:var(--muted)}
.primary{background:var(--primary);color:#202617;font-weight:800;border-radius:16px;padding:14px 18px}
.ghost{background:var(--muted);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.pagehead{display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.pagehead h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:30px;letter-spacing:-.03em;margin:0}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#222a3bdd;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav ul{list-style:none;margin:0 auto;padding:0;max-width:448px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:64px;background:transparent;color:var(--mutedfg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px}
.nav button.active{color:var(--primary)}
.nav .ico{font-size:21px;line-height:1}
.hidden{display:none!important}
.period{display:flex;gap:4px;background:var(--muted);border-radius:99px;padding:4px}
.period button{padding:9px 15px;background:transparent;border-radius:99px;font-size:13px}
.period button.active{background:var(--primary);color:#202617}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.stat strong{display:block;font-size:23px;margin-top:8px}
.bar{height:8px;border-radius:99px;background:var(--muted);overflow:hidden;flex:1}
.bar span{display:block;height:100%;background:var(--primary);border-radius:99px}
.catrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.sheetback{position:fixed;inset:0;z-index:10;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:448px;background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);max-height:88dvh;overflow:auto}
.sheet h2{font-size:22px;margin:0 0 18px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mutedfg);margin:0 0 7px}
.field input,.field select{width:100%;background:var(--muted);border:1px solid var(--line);color:var(--fg);border-radius:16px;padding:15px;outline:none}
.field input:focus,.field select:focus{box-shadow:0 0 0 2px var(--primary)}
.full{width:100%}
.actions{display:flex;gap:8px}
.secondary{background:var(--muted);border-radius:16px;padding:13px 16px}
.note{font-size:12px;color:var(--mutedfg);line-height:1.5;margin-top:16px}
.row{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<main><div id="app"></div></main>
<nav class="nav"><ul id="nav"></ul></nav>
<div id="modal"></div>
<script>
const KEY="spend-pool:v1", COLORS=["#c9f04a","#ff8a5b","#5bc8ff","#ff5fa2","#b48cff","#ffd25b","#4ee6a8","#ff6b6b"];
const DEFAULTS=[
{id:"cig",name:"Cig",emoji:"🚬",color:"#ff8a5b",builtIn:true},
{id:"food",name:"Food",emoji:"🍜",color:"#ffd25b",builtIn:true},
{id:"impulse",name:"Impulse",emoji:"⚡",color:"#ff5fa2",builtIn:true},
{id:"donate",name:"Donate",emoji:"💝",color:"#4ee6a8",builtIn:true}
];
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
let state={categories:DEFAULTS,expenses:[]},view="today",period=7,selectedDate=key(new Date()),modal=null;
try{
const x=JSON.parse(localStorage.getItem(KEY)||"null");
if(x&&Array.isArray(x.categories)&&Array.isArray(x.expenses))state=x;
}catch{}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:Number.isInteger(n)?0:2}).format(n)}
function dateLabel(k,opts={weekday:"long",day:"numeric",month:"long"}){return new Date(k+"T12:00:00").toLocaleDateString("en-IN",opts)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function category(id){return state.categories.find(c=>c.id===id)||{id,name:"Unknown",emoji:"❔",color:"#888"}}
function breakdown(ex){
let total=ex.reduce((s,e)=>s+e.amount,0),m={};
ex.forEach(e=>m[e.categoryId]=(m[e.categoryId]||0)+e.amount);
return {total,rows:Object.entries(m).map(([id,amount])=>({cat:category(id),amount,pct:total?amount/total*100:0})).sort((a,b)=>b.amount-a.amount)}
}
function txList(ex){
return ex.slice().sort((a,b)=>b.createdAt-a.createdAt).map(e=>{
let c=category(e.categoryId);
return `<div class="tx"><span class="em" style="background:${c.color}33">${esc(c.emoji)}</span><div class="grow"><div class="txnote">${esc(e.note||c.name)}</div><div class="txmeta">${esc(c.name)} · ${dateLabel(e.date,{day:"numeric",month:"short"})}</div></div><div style="text-align:right"><div class="txmoney">${money(e.amount)}</div><div class="txactions"><button class="tiny" onclick="editExpense('${e.id}')">Edit</button><button class="tiny" onclick="deleteExpense('${e.id}')">Delete</button></div></div></div>`
}).join("")
}
function card(content,cls=""){return `<section class="card ${cls}">${content}</section>`}
function empty(emoji,title,body){return `<div class="empty"><div class="big">${emoji}</div><strong>${title}</strong><div class="muted">${body}</div></div>`}
function render(){
let today=key(new Date()),todayEx=state.expenses.filter(e=>e.date===today),b=breakdown(todayEx),active=state.categories.filter(c=>!c.archived),app="";
if(view==="today"){
app=`<div class="space"><header class="date">${dateLabel(today)}</header><section class="pool"><div class="upper">Spent today</div><div class="total">${money(b.total)}</div><div class="muted">${todayEx.length} ${todayEx.length===1?"expense":"expenses"}</div></section><section class="quick">${active.map(c=>{let a=b.rows.find(r=>r.cat.id===c.id)?.amount||0;return `<button style="background:linear-gradient(145deg,${c.color}33,${c.color}0d)" onclick="openAdd('${c.id}')"><span class="em" style="background:${c.color}40">${c.emoji}</span><span><span class="catname">${esc(c.name)}</span><span class="catamt">${money(a)}</span></span></button>`}).join("")}</section>${card(todayBreakdown(todayEx))}${todayEx.length?card(`<h2 class="h2">Today's transactions</h2>${txList(todayEx)}`):""}</div>`
}
if(view==="history"){
let day=state.expenses.filter(e=>e.date===selectedDate),bd=breakdown(day),totals={};
state.expenses.forEach(e=>totals[e.date]=(totals[e.date]||0)+e.amount);
let recent=Object.entries(totals).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30),max=Math.max(1,...recent.map(x=>x[1]));
app=`<div class="space"><h1 class="pagehead" style="font-size:30px">History</h1>${card(`<div class="row" style="justify-content:space-between"><button class="ghost" onclick="shiftDay(-1)">‹</button><label style="text-align:center;font-weight:600">${selectedDate===today?"Today":dateLabel(selectedDate,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}<input type="date" value="${selectedDate}" max="${today}" onchange="pickDay(this.value)" style="display:block;margin-top:6px;background:var(--muted);border:0;border-radius:10px;padding:6px;color:inherit"></label><button class="ghost" onclick="shiftDay(1)" ${selectedDate===today?"disabled":""}>›</button></div><div class="total" style="text-align:center;font-size:38px">${money(bd.total)}</div><div style="text-align:center"><button class="primary" onclick="openAdd(null,'${selectedDate}')">＋ Add expense${selectedDate===today?"":" for this day"}</button></div><div style="margin-top:18px">${day.length?breakdownRows(day)+txList(day):empty("📭","Nothing recorded","No expenses on this day.")}</div>`)}${card(`<h2 class="h2">Recent days</h2>${recent.length?recent.map(([k,v])=>`<button onclick="pickDay('${k}')" class="row" style="width:100%;background:transparent;padding:12px;border-radius:16px;text-align:left"><span style="width:92px;font-size:13px">${k===today?"Today":dateLabel(k,{weekday:"short",day:"numeric",month:"short"})}</span><span class="bar"><span style="width:${v/max*100}%"></span></span><b style="width:95px;text-align:right;font-size:13px">${money(v)}</b></button>`).join(""):empty("🗓️","No history yet","Days you log spending will appear here.")}`)}</div>`
}
if(view==="insights"){
let from=new Date();from.setDate(from.getDate()-(period-1));
let k0=key(from),ex=state.expenses.filter(e=>e.date>=k0&&e.date<=today),bd=breakdown(ex),days=new Set(ex.map(e=>e.date)).size,top=bd.rows[0],bars=Array.from({length:period},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(period-1-i));let k=key(d);return {k,v:ex.filter(e=>e.date===k).reduce((s,e)=>s+e.amount,0)}}),max=Math.max(1,...bars.map(x=>x.v));
app=`<div class="space"><header class="pagehead"><h1>Insights</h1><div class="period"><button class="${period===7?"active":""}" onclick="setPeriod(7)">7 days</button><button class="${period===30?"active":""}" onclick="setPeriod(30)">30 days</button></div></header><section class="pool"><div class="upper">Total in ${period} days</div><div class="total">${money(bd.total)}</div><div class="muted">${days} active ${days===1?"day":"days"} · ${ex.length} expenses</div></section><div class="statgrid"><div class="stat"><div class="muted">Daily average</div><strong>${money(bd.total/period)}</strong></div><div class="stat"><div class="muted">Top category</div><strong>${top?esc(top.cat.emoji+" "+top.cat.name):"—"}</strong><div class="muted">${top?money(top.amount):"No data yet"}</div></div></div>${card(`<h2 class="h2">Daily spending</h2><div style="display:flex;align-items:end;gap:4px;height:130px">${bars.map(x=>`<div title="${x.k}: ${money(x.v)}" style="flex:1;height:100%;display:flex;align-items:end"><span style="display:block;width:100%;height:${Math.max(x.v?4:1,x.v/max*100)}%;background:var(--primary);border-radius:5px 5px 2px 2px;opacity:${x.v?1:.2}"></span></div>`).join("")}</div><div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">${bars[0].k.slice(5)}</span><span class="muted">${bars.at(-1).k.slice(5)}</span></div>`)}${card(`<h2 class="h2">By category</h2>${bd.rows.length?breakdownRows(ex):empty("📊","No data yet","Add expenses to see your spending breakdown.")}`)}</div>`
}
if(view==="categories"){
app=`<div class="space"><header class="pagehead"><h1>Categories</h1><button class="primary" onclick="openCategory()">＋ New</button></header>${card(`<ul style="padding:0;margin:0;list-style:none">${active.map(c=>`<li class="catrow"><span class="em" style="background:${c.color}33">${esc(c.emoji)}</span><div class="grow"><div style="font-weight:600">${esc(c.name)}</div><div class="muted">${c.builtIn?"Default":"Custom"} · ${state.expenses.filter(e=>e.categoryId===c.id).length} expenses</div></div><button class="ghost" onclick="openCategory('${c.id}')" aria-label="Edit">✎</button>${!c.builtIn?`<button class="ghost" onclick="archiveCategory('${c.id}')" aria-label="Delete">⌫</button>`:""}</li>`).join("")}</ul>`)}${card(`<h2 class="h2">Local data</h2><p class="muted">Your expenses stay in this browser on this device. Export a backup regularly.</p><div class="actions"><button class="secondary" onclick="exportBackup()">Export backup</button><button class="secondary" onclick="$('importFile').click()">Import backup</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importBackup(this)"></div>`)}</div>`
}
$("app").innerHTML=app;
const nav=[["today","⌂","Today"],["history","▦","History"],["insights","◔","Insights"],["categories","◇","Categories"]];
$("nav").innerHTML=nav.map(([id,ico,label])=>`<li><button class="${view===id?"active":""}" onclick="setView('${id}')"><span class="ico">${ico}</span>${label}</button></li>`).join("");
}
function todayBreakdown(ex){
let b=breakdown(ex);
if(!b.rows.length)return `<h2 class="h2">Today's breakdown</h2>${empty("🌱","No spending yet","Tap a category above to log your first expense.")}`;
let lead=b.rows.length===1?"is all of today's spend":`leads today at ${b.rows[0].pct.toFixed(0)}% of your spend`;
return `<h2 class="h2">Today's breakdown</h2><div class="hint">${b.rows[0].cat.emoji} <b>${esc(b.rows[0].cat.name)}</b> ${lead} (${money(b.rows[0].amount)}).</div>${breakdownRows(ex)}`
}
function breakdownRows(ex){
let b=breakdown(ex);
return b.rows.map(r=>`<div class="catrow"><span class="em" style="background:${r.cat.color}33">${esc(r.cat.emoji)}</span><div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.cat.name)}</b><span class="muted">${r.pct.toFixed(0)}%</span></div><div class="bar" style="margin-top:8px"><span style="width:${r.pct}%"></span></div></div><b>${money(r.amount)}</b></div>`).join("")
}
function setView(v){view=v;render();window.scrollTo(0,0)}
function setPeriod(v){period=v;render()}
function pickDay(v){selectedDate=v;render()}
function shiftDay(n){let d=new Date(selectedDate+"T12:00:00");d.setDate(d.getDate()+n);if(key(d)<=key(new Date()))pickDay(key(d))}
function openAdd(catId,date=key(new Date()),expenseId=null){modal={type:"expense",catId,date,expenseId};renderModal()}
function editExpense(id){let e=state.expenses.find(x=>x.id===id);if(e)openAdd(e.categoryId,e.date,id)}
function deleteExpense(id){if(confirm("Delete this expense?")){state.expenses=state.expenses.filter(e=>e.id!==id);save()}}
function openCategory(id=null){modal={type:"category",id};renderModal()}
function archiveCategory(id){if(confirm("Remove this category from quick-add? Past expenses will stay in history.")){state.categories=state.categories.map(c=>c.id===id?{...c,archived:true}:c);save()}}
function closeModal(){modal=null;$("modal").innerHTML=""}
function renderModal(){
if(!modal)return;
let m=modal;
if(m.type==="expense"){
let e=m.expenseId?state.expenses.find(x=>x.id===m.expenseId):null,cats=state.categories.filter(c=>!c.archived);
$("modal").innerHTML=`<div class="sheetback" onclick="if(event.target===this)closeModal()"><section class="sheet"><h2>${e?"Edit expense":"Add expense"}</h2><form onsubmit="saveExpense(event)"><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min=".01" step=".01" required autofocus value="${e?e.amount:""}" placeholder="0"></div><div class="field"><label>Category</label><select name="categoryId">${cats.map(c=>`<option value="${esc(c.id)}" ${(e?.categoryId||m.catId)===c.id?"selected":""}>${esc(c.emoji)} ${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Note (optional)</label><input name="note" maxlength="100" value="${esc(e?.note||"")}" placeholder="What was it for?"></div><div class="field"><label>Date</label><input name="date" type="date" max="${key(new Date())}" value="${e?.date||m.date}" required></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" style="flex:1">${e?"Save changes":"Add expense"}</button></div></form></section></div>`
}else{
let c=m.id?category(m.id):{name:"",emoji:"☕",color:COLORS[2]};
$("modal").innerHTML=`<div class="sheetback" onclick="if(event.target===this)closeModal()"><section class="sheet"><h2>${m.id?"Edit category":"New category"}</h2><form onsubmit="saveCategory(event)"><div class="field"><label>Emoji</label><input name="emoji" maxlength="4" value="${esc(c.emoji)}"></div><div class="field"><label>Name</label><input name="name" maxlength="20" required value="${esc(c.name)}" placeholder="Category name"></div><div class="field"><label>Color</label><div class="actions">${COLORS.map(color=>`<button type="button" onclick="this.form.color.value='${color}';this.form.querySelectorAll('[data-color]').forEach(x=>x.style.outline=x.dataset.color==='${color}'?'2px solid white':'none')" data-color="${color}" style="width:32px;height:32px;border-radius:50%;background:${color}"></button>`).join("")}</div><input type="hidden" name="color" value="${c.color}"></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" style="flex:1">Save</button></div></form></section></div>`
}
}
function saveExpense(ev){
ev.preventDefault();
let f=new FormData(ev.target),amount=Number(f.get("amount"));
if(amount<=0)return;
let e=modal.expenseId&&state.expenses.find(x=>x.id===modal.expenseId);
if(e)Object.assign(e,{amount,categoryId:f.get("categoryId"),note:String(f.get("note")||"").trim(),date:f.get("date")});
else state.expenses.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),createdAt:Date.now(),amount,categoryId:f.get("categoryId"),note:String(f.get("note")||"").trim(),date:f.get("date")});
closeModal();save()
}
function saveCategory(ev){
ev.preventDefault();
let f=new FormData(ev.target),name=String(f.get("name")).trim(),emoji=String(f.get("emoji")||"🏷️"),color=f.get("color");
if(!name)return;
if(modal.id)state.categories=state.categories.map(c=>c.id===modal.id?{...c,name,emoji,color}:c);
else state.categories.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,emoji,color});
closeModal();save()
}
function exportBackup(){
let a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
a.href=url;a.download="spend-pool-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
async function importBackup(input){
try{
let d=JSON.parse(await input.files[0].text());
if(!Array.isArray(d.categories)||!Array.isArray(d.expenses))throw Error();
if(confirm("Replace current data with this backup?")){state=d;save()}
}catch{alert("Invalid backup file")}
input.value=""
}
render();
</script>
</body>
</html>
